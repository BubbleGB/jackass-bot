name: Production image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Build production image natively (no registry publication)
        run: docker build --tag galaxy-image:test .
      - name: Exercise production entry point and packaged assets
        shell: bash
        run: |
          set -o pipefail
          npm run test:image -- galaxy-image:test 2>&1 | tee image-test.log
      - name: Retain image test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-${{ matrix.runner }}
          path: image-test.log
          retention-days: 14
