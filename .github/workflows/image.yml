name: Production image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Validate merged production Compose with dummy values
        run: npm run test:compose
      - name: Build production image natively (no registry publication)
        run: |
          docker build --provenance=false --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/BubbleGB/jackass-bot \
            --tag galaxy-image:test .
      - name: Exercise production entry point and packaged assets
        shell: bash
        run: |
          set -o pipefail
          npm run test:image -- galaxy-image:test 2>&1 | tee image-test.log
      - name: Verify tested image archive round-trip without publishing
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          ARCHIVE_FILE: ${{ runner.temp }}/native-image/image.tar.gz
        run: |
          set -o pipefail
          export ARCHITECTURE
          ARCHITECTURE=$(node -p "process.arch === 'arm64' ? 'arm64' : 'amd64'")
          mkdir -p "$(dirname "$ARCHIVE_FILE")"
          docker tag galaxy-image:test "galaxy-release:$ARCHITECTURE"
          docker save "galaxy-release:$ARCHITECTURE" | gzip -1 > "$ARCHIVE_FILE"
          node deploy/release/cli.mjs record
          node deploy/release/cli.mjs roundtrip
      - name: Retain image test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-${{ matrix.runner }}
          path: |
            image-test.log
            ${{ runner.temp }}/native-image/proof.json
          retention-days: 14
